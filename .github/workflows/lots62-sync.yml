name: LOTS 62 Price Sync

on:
  schedule:
    # Same times as the LOTS sync, 15 min later: 3:15 AM and 12:15 PM IST
    - cron: '45 21 * * *'
    - cron: '45 6 * * *'
    # Extra price refresh every 2 hours, 7 AM - 11 PM IST
    - cron: '29 1-17/2 * * *'
  workflow_dispatch: {}

concurrency:
  group: lots62-sync
  cancel-in-progress: false

jobs:
  sync:
    # LOTS blocks cloud servers (since 30 Oct 2026), so this runs on the office computer
    runs-on: [self-hosted, windows, lots-office]
    defaults:
      run:
        shell: cmd  # Windows blocks PowerShell scripts on the office PC
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install chromium
      - name: Run LOTS 62 sync
        env:
          LOTS62_USERNAME: ${{ secrets.LOTS62_USERNAME }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SHOP_ID: ${{ secrets.SHOP_ID }}
          LOTS62_PASSWORD: ${{ secrets.LOTS62_PASSWORD }}
          LOTS62_STORE_CODE: ${{ secrets.LOTS62_STORE_CODE }}
          AIKM_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.AIKM_FIREBASE_SERVICE_ACCOUNT }}
          GREENAPI_INSTANCE_ID: ${{ secrets.GREENAPI_INSTANCE_ID }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_CHAT_ID: ${{ secrets.GREENAPI_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node lots62-sync.js
