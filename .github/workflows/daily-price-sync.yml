name: Daily LOTS Price Sync

on:
  schedule:
    # 4 times a day (IST): 7 AM + 12 noon full sync, 4 PM + 9 PM price refresh for the POS.
    # Kept low on purpose: LOTS blocks robots that read the catalog too often.
    # Times are UTC: 01:30 = 7 AM IST, 06:30 = 12 noon, 10:23 = ~4 PM, 15:23 = ~9 PM.
    - cron: '30 1 * * *'
    - cron: '30 6 * * *'
    - cron: '23 10,15 * * *'
  workflow_dispatch: {} # lets you also click "Run workflow" manually on GitHub

# never let two syncs run at the same time (e.g. a late scheduled run + a manual one)
concurrency:
  group: lots-price-sync
  cancel-in-progress: false

jobs:
  sync:
    # LOTS blocks cloud servers (since 30 Oct 2026), so this runs on the office computer
    runs-on: [self-hosted, windows, lots-office]
    defaults:
      run:
        shell: cmd  # Windows blocks PowerShell scripts on the office PC
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run price sync
        env:
          LOTS_USERNAME: ${{ secrets.LOTS_USERNAME }}
          LOTS_PASSWORD: ${{ secrets.LOTS_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SHOP_ID: ${{ secrets.SHOP_ID }}
          POS_ONLY: ${{ github.event.schedule == '23 10,15 * * *' && '1' || '' }}
          AIKM_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.AIKM_FIREBASE_SERVICE_ACCOUNT }}
          GREENAPI_INSTANCE_ID: ${{ secrets.GREENAPI_INSTANCE_ID }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_CHAT_ID: ${{ secrets.GREENAPI_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run sync
