name: Daily LOTS Price Sync

on:
  schedule:
    # Runs at 03:00 UTC = 8:30 AM IST, every day.
    # Change the "0 3" below to move the time — cron is in UTC.
    # (IST = UTC + 5:30, so 03:00 UTC = 08:30 IST)
    - cron: '0 3 * * *'
  workflow_dispatch: {} # lets you also click "Run workflow" manually on GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run price sync
        env:
          LOTS_USERNAME: ${{ secrets.LOTS_USERNAME }}
          LOTS_PASSWORD: ${{ secrets.LOTS_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SHOP_ID: ${{ secrets.SHOP_ID }}
        run: npm run sync
