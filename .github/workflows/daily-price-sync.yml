name: Daily LOTS Price Sync

on:
  schedule:
    # GitHub often starts scheduled jobs 1-3 hours late, so the sync runs twice a day.
    # Times are UTC: 21:30 UTC = 3:00 AM IST, 06:30 UTC = 12:00 noon IST.
    - cron: '30 21 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch: {} # lets you also click "Run workflow" manually on GitHub

# never let two syncs run at the same time (e.g. a late scheduled run + a manual one)
concurrency:
  group: lots-price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run price sync
        env:
          LOTS_USERNAME: ${{ secrets.LOTS_USERNAME }}
          LOTS_PASSWORD: ${{ secrets.LOTS_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SHOP_ID: ${{ secrets.SHOP_ID }}
          AIKM_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.AIKM_FIREBASE_SERVICE_ACCOUNT }}
          GREENAPI_INSTANCE_ID: ${{ secrets.GREENAPI_INSTANCE_ID }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_CHAT_ID: ${{ secrets.GREENAPI_CHAT_ID }}
        run: npm run sync
