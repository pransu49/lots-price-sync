name: LOTS Bill Probe (one-time, read-only)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['lots-bill-probe.js']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"
      - env:
          LOTS_USERNAME: ${{ secrets.LOTS_USERNAME }}
          LOTS_PASSWORD: ${{ secrets.LOTS_PASSWORD }}
        run: node lots-bill-probe.js
