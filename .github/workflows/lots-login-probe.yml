name: LOTS Login Probe (one-time)
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: node lots-login-probe.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: 'probe-*.png' }
