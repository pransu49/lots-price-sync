name: LOTS Login Probe (one-time)
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s https://ipinfo.io/json | grep -E '"(ip|city|country|org)"'
          for u in https://www.lotswholesale.com/ https://api.lotswholesale.com/ https://lotswholesale.com/; do
            echo "== $u"; curl -s -m 20 -o /tmp/b -w "HTTP %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129 Safari/537.36" "$u"; head -c 200 /tmp/b; echo
          done
