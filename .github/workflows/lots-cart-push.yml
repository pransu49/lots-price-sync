name: LOTS Smart Cart Push

on:
  schedule:
    # every 5 minutes: checks if the Admin Console sent an order to LOTS
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # "Run workflow" button for an instant push

concurrency:
  group: lots-cart-push
  cancel-in-progress: false

jobs:
  # 1) quick check on GitHub (does not touch LOTS)
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pending: ${{ steps.q.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Check for orders waiting
        id: q
        env:
          AIKM_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.AIKM_FIREBASE_SERVICE_ACCOUNT }}
        run: node lots-cart-push.js check

  # 2) the actual LOTS upload runs on the office computer (LOTS blocks cloud servers since 30 Oct 2026)
  push:
    needs: check
    if: needs.check.outputs.pending == 'true'
    runs-on: [self-hosted, windows, lots-office]
    defaults:
      run:
        shell: cmd  # Windows blocks PowerShell scripts on the office PC
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install chromium
      - name: Upload to LOTS Smart Cart
        env:
          LOTS_USERNAME: ${{ secrets.LOTS_USERNAME }}
          LOTS_PASSWORD: ${{ secrets.LOTS_PASSWORD }}
          LOTS62_USERNAME: ${{ secrets.LOTS62_USERNAME }}
          LOTS62_PASSWORD: ${{ secrets.LOTS62_PASSWORD }}
          AIKM_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.AIKM_FIREBASE_SERVICE_ACCOUNT }}
        run: node lots-cart-push.js

  # 3) Telegram alert if the upload failed
  alert:
    needs: push
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔴 LOTS Smart Cart upload FAILED - the order file did not reach LOTS. Upload it by hand or share the details with Claude.

          Details: ${RUN_URL}" > /dev/null || true
